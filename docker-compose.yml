# Neon is the only application database. DATABASE_URL comes from the ignored
# repo-root `.env`; Compose never replaces it with a local Postgres hostname.
# The Postgres service is available only through the explicit `local-db`
# profile for isolated migration verification.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindflip
      POSTGRES_PASSWORD: mindflip
      POSTGRES_DB: mindflip
    volumes:
      - mindflip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindflip -d mindflip"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mindflip
    profiles:
      - local-db

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mindflip

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to Neon}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mindflip
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to Neon}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mindflip
    restart: unless-stopped

  beat:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "beat", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to Neon}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mindflip
    restart: unless-stopped

networks:
  mindflip:
    driver: bridge

volumes:
  mindflip_pgdata:
